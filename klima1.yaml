
# Kältebringer KBO12-R290
# ESPHome / Home Assistant
# Tested with ESPHome 2026.11.0
# Tuya MCU UART: 9600 baud, 8N1

esphome:
  name: kaeltebringer-kbo12
  friendly_name: Kältebringer KBO12-R290

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

uart:
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600

tuya:

climate:
  - platform: tuya
    name: Klimaanlage

    switch_datapoint: 1
    target_temperature_datapoint: 2
    current_temperature_datapoint: 3

    supports_heat: true
    supports_cool: true

    active_state:
      datapoint: 4
      cooling_value: 0
      heating_value: 1
      drying_value: 2
      fanonly_value: 3

    fan_mode:
      datapoint: 5
      auto_value: 0
      low_value: 2
      medium_value: 3
      high_value: 4

    preset:
      eco:
        datapoint: 8
        temperature: 20
      sleep:
        datapoint: 101

    swing_mode:
      vertical_datapoint: 106
      horizontal_datapoint: 107

switch:
  - platform: tuya
    name: Displaybeleuchtung
    switch_datapoint: 104
    icon: mdi:lightbulb-outline
